<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Border / Outline (#1a0f08) -->
  <g fill="#1a0f08">
    <!-- Top cover curves -->
    <rect x="4" y="2" width="3" height="1" />
    <rect x="8" y="2" width="4" height="1" />
    <rect x="3" y="3" width="1" height="1" />
    <rect x="7" y="3" width="2" height="1" />
    <rect x="12" y="3" width="1" height="1" />
    
    <!-- Vertical side borders -->
    <rect x="2" y="4" width="1" height="6" />
    <rect x="7" y="4" width="1" height="6" />
    <rect x="12" y="4" width="1" height="6" />
    
    <!-- Bottom cover corners -->
    <rect x="3" y="10" width="1" height="1" />
    <rect x="11" y="10" width="1" height="1" />
    <rect x="4" y="11" width="8" height="1" />
    
    <!-- Bookmark ribbon outer shadows -->
    <rect x="5" y="12" width="1" height="1" />
    <rect x="9" y="12" width="1" height="1" />
    <rect x="6" y="13" width="1" height="1" />
    <rect x="8" y="13" width="1" height="1" />
    <rect x="7" y="14" width="1" height="1" />
  </g>
  
  <!-- Parchment Pages (#f5ecd5) -->
  <g fill="#f5ecd5">
    <rect x="4" y="3" width="3" height="1" />
    <rect x="9" y="3" width="3" height="1" />
    <rect x="3" y="4" width="4" height="6" />
    <rect x="8" y="4" width="4" height="6" />
    <rect x="4" y="10" width="3" height="1" />
    <rect x="8" y="10" width="3" height="1" />
  </g>

  <!-- Text lines inside the pages (#8a6f44) -->
  <g fill="#8a6f44">
    <rect x="4" y="5" width="2" height="1" />
    <rect x="9" y="5" width="2" height="1" />
    <rect x="4" y="7" width="2" height="1" />
    <rect x="9" y="7" width="2" height="1" />
    <rect x="4" y="9" width="2" height="1" />
    <rect x="9" y="9" width="2" height="1" />
  </g>

  <!-- Bookmark Ribbon Cover (#8c2424) -->
  <g fill="#8c2424">
    <rect x="6" y="12" width="3" height="1" />
    <rect x="7" y="13" width="1" height="1" />
  </g>
</svg>